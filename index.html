<div style="width:100%;height:100vh;overflow:hidden;">
  <canvas id="spline-canvas" style="width:100%;height:100%;display:block;"></canvas>
</div>

<script type="module">
  import { Application } from 'https://cdn.jsdelivr.net/npm/@splinetool/runtime@1.9.59/build/runtime.js';

  const canvas = document.getElementById('spline-canvas');
  const app = new Application(canvas);
  await app.load('https://prod.spline.design/GXgGQ9ASqli6eO3Q/scene.splinecode');

  const MIN = -50, MAX = 50;
  const REST = 1;
  const SCROLL_SENS = 0.003;
  const FOLLOW_RATE = 6;
  const RETURN_RATE = 16;
  const IDLE_DELAY_MS = 80;

  let gravity = Number(app.getVariable('gravity')) || REST;
  let targetGravity = gravity;
  let lastWheelTs = 0;

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const approach = (cur,tgt,rate,dt)=>{
    const k = 1 - Math.exp(-rate * dt);
    return cur + (tgt - cur) * k;
  };

  window.addEventListener('wheel', (e) => {
    lastWheelTs = performance.now();
    const delta = e.deltaY * SCROLL_SENS;
    targetGravity = clamp(targetGravity + delta, MIN, MAX);
  }, { passive: true });

  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    const idle = (now - lastWheelTs) > IDLE_DELAY_MS;
    if (idle) targetGravity = REST;
    gravity = approach(gravity, targetGravity, idle ? RETURN_RATE : FOLLOW_RATE, dt);
    if (idle && Math.abs(gravity - REST) < 0.001) gravity = REST;
    app.setVariable('gravity', gravity);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const ro = new ResizeObserver(entries=>{
    for(const e of entries){
      const cr = e.contentRect;
      app.setSize(cr.width, cr.height);
    }
  });
  ro.observe(canvas.parentElement);
</script>
